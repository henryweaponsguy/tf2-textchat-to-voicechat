services:
  tf2-radio:
    image: tf2-radio:latest
    build: .
    container_name: tf2-radio
    environment:
      PULSE_SERVER: unix:/run/user/${UID}/pulse/native
    volumes:
      # Files cannot be replaced, only modified. Otherwise Docker loses track of them.
      # Make sure "console.log" and "message.cfg" exist before starting the container,
      # otherwise Docker will create a directory with that name on the host
      - /run/user/${UID}/pulse/native:/run/user/${UID}/pulse/native:ro
      - ${HOME}/.steam/steam/steamapps/common/Team Fortress 2/tf/console.log:/app/console.log:ro
      - ${HOME}/.steam/steam/steamapps/common/Team Fortress 2/tf/cfg/overrides/message.cfg:/app/message.cfg
      - ./index.html:/app/index.html:ro
      - ./radio.py:/app/radio.py:ro
      - ./sounds:/app/sounds:ro
      - ./queue:/app/queue
    devices:
      - /dev/snd
    ports:
      - "8000:8000"
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

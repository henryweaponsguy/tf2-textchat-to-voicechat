services:
  tf2-translator-tts:
    image: tf2-tts-piper:latest
    container_name: tf2-translator-tts
    volumes:
      - ./models-tts:/tts/models:ro
    ports:
      - "5000:5000"
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
  tf2-translator:
    image: tf2-translator:latest
    build: .
    container_name: tf2-translator
    environment:
      PULSE_SERVER: unix:/run/user/${UID}/pulse/native
    volumes:
      # Files cannot be replaced, only modified. Otherwise Docker loses track of them.
      # Make sure "console.log" exists before starting the container,
      # otherwise Docker will create a directory with that name on the host
      - /run/user/${UID}/pulse/native:/run/user/${UID}/pulse/native:ro
      - ${HOME}/.steam/steam/steamapps/common/Team Fortress 2/tf/console.log:/tts/console.log:ro
      - ./chat_to_speech.sh:/tts/chat_to_speech.sh:ro
      - ./get_piper_voice.sh:/tts/get_piper_voice.sh:ro
      - ./get_translation.sh:/tts/get_translation.sh:ro
      - ./models-translator:/root/.local/share/argos-translate
    devices:
      - /dev/snd
    ports:
      - "5001:5001"
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

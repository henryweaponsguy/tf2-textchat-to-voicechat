services:
  stt-piper:
    image: stt-piper:latest
    build: .
    container_name: stt-piper
    environment:
      PULSE_SERVER: unix:/run/user/${UID}/pulse/native
    volumes:
      - /run/user/${UID}/pulse/native:/run/user/${UID}/pulse/native:ro
      - ./speech_to_speech.py:/app/speech_to_speech.py:ro
      - ./models:/app/models:ro
      - ./models-tts:/app/models-tts:ro
    devices:
      - /dev/snd
    ports:
      - "5000:5000"
    network_mode: none
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

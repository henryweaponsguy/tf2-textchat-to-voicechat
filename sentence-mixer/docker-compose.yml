services:
  tf2-sentence-mixer:
    image: tf2-sentence-mixer:latest
    build: .
    container_name: tf2-sentence-mixer
    environment:
      PULSE_SERVER: unix:/run/user/${UID}/pulse/native
    volumes:
      # Files cannot be replaced, only modified. Otherwise Docker loses track of them.
      # Make sure "console.log" exists before starting the container,
      # otherwise Docker will create a directory with that name on the host
      - /run/user/${UID}/pulse/native:/run/user/${UID}/pulse/native:ro
      - ${HOME}/.steam/steam/steamapps/common/Team Fortress 2/tf/console.log:/app/console.log:ro
      - ./sentence_mixer.py:/app/sentence_mixer.py:ro
      - ./convert_numbers_to_words.py:/app/convert_numbers_to_words.py:ro
      - ./get_sentencemixed_voice.py:/app/get_sentencemixed_voice.py:ro
      - ./voices:/app/voices:ro
    devices:
      - /dev/snd
    network_mode: none
    security_opt:
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
